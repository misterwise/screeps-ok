name: CI

# Prose doesn't trigger a run; the catalog does.
on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE'
      - 'behaviors.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE'
      - 'behaviors.md'
  workflow_dispatch:
    inputs:
      tick-profile:
        description: Log the vanilla adapter's per-stage tick timings
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out screeps-ok
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-lint-${{ runner.os }}-${{ runner.arch }}-node24.14.1-${{ hashFiles('package-lock.json', '.xxscreeps-pin', 'scripts/build-xxscreeps.js', 'scripts/pathfinder-vendor.js', 'vendor/pathfinder/**') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build xxscreeps for typecheck
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: node scripts/build-xxscreeps.js

      # The pre-commit hook's gates; a clone can skip or lack the hook.
      - name: Static checks
        run: npm run check

      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::npm run check regenerated committed files; commit what it wrote."
            exit 1
          fi

      # prepack runs these too; here a `files` or build change fails before the publish.
      - name: Package contents
        run: npm run build && npm run validate:package

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - xxscreeps
          - vanilla
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out screeps-ok
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ matrix.adapter }}-full-${{ runner.os }}-${{ runner.arch }}-node24.14.1-${{ hashFiles('package-lock.json', '.xxscreeps-pin', 'scripts/build-xxscreeps.js', 'scripts/pathfinder-vendor.js', 'vendor/pathfinder/**', 'scripts/setup.js') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build adapter prerequisites
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm run setup:${{ matrix.adapter }}

      - name: Run ${{ matrix.adapter }} suite (shard ${{ matrix.shard }}/4)
        run: npm test ${{ matrix.adapter }} -- --shard=${{ matrix.shard }}/4
        env:
          SCREEPS_OK_TICK_PROFILE: ${{ inputs.tick-profile && '1' || '' }}

      - name: Upload ${{ matrix.adapter }}-${{ matrix.shard }} report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.adapter }}-${{ matrix.shard }}
          path: reports/${{ matrix.adapter }}-partial.json
          if-no-files-found: error

  summarize:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out screeps-ok
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: downloaded

      - name: Merge shards and write summary
        # Keep in step with the test job's matrix.
        run: node scripts/ci-merge-reports.js --adapters=xxscreeps,vanilla --shards=4 --artifacts-dir=downloaded

      - name: Upload merged per-adapter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-merged
          path: reports/
          if-no-files-found: ignore
